<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pozivnica za vjenčanje</title>
<meta name="description" content="Pozivnica za naše vjenčanje">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf6f0; --paper:#fffdf9; --ink:#3d3530; --muted:#8a7d72;
    --gold:#b8956a; --gold-soft:#e8d9c4; --sage:#8fa38a; --blush:#e9cfc6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:'Cormorant Garamond',Georgia,serif;background:var(--cream);color:var(--ink);font-size:19px;line-height:1.6;overflow-x:hidden}
  body.locked{overflow:hidden}
  .script{font-family:'Great Vibes',cursive;font-weight:400}

  /* ---------- OMOTNICA ---------- */
  #envelope-screen{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#fdf9f3,#efe5d8);transition:opacity 1s ease, visibility 1s}
  #envelope-screen.gone{opacity:0;visibility:hidden}
  .envelope{position:relative;width:min(80vw,340px);aspect-ratio:1.45;cursor:pointer;perspective:900px}
  .env-back{position:absolute;inset:0;background:#e4d3bd;border-radius:6px;box-shadow:0 20px 40px rgba(90,60,30,.18)}
  .env-letter{position:absolute;left:6%;right:6%;top:8%;bottom:8%;background:var(--paper);border-radius:4px;display:flex;align-items:center;justify-content:center;flex-direction:column;transition:transform 1s .5s cubic-bezier(.4,0,.2,1);z-index:2}
  .env-letter .script{font-size:clamp(28px,8vw,40px);color:var(--gold)}
  .env-letter > *{opacity:0;transition:opacity .6s 1s}
  .envelope.open .env-letter > *{opacity:1}
  .env-front{position:absolute;inset:0;z-index:3;border-radius:6px;overflow:hidden;pointer-events:none}
  .env-front::before,.env-front::after{content:"";position:absolute;bottom:0;width:0;height:0;border-bottom:calc(min(80vw,340px)/1.45*.62) solid #ecdcc7}
  .env-front::before{left:0;border-right:calc(min(80vw,340px)*.55) solid transparent}
  .env-front::after{right:0;border-left:calc(min(80vw,340px)*.55) solid transparent}
  .env-flap{position:absolute;top:0;left:0;right:0;height:62%;z-index:4;transform-origin:top;transition:transform .7s ease, z-index 0s .35s}
  .env-flap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 3px rgba(90,60,30,.12))}
  .seal{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);z-index:5;width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#c9a27a,#9c7448);display:flex;align-items:center;justify-content:center;color:#fff8ee;font-family:'Great Vibes',cursive;font-size:24px;box-shadow:0 3px 8px rgba(0,0,0,.25);transition:opacity .4s, transform .4s}
  .envelope.open .seal{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  .envelope.open .env-flap{transform:rotateX(180deg);z-index:1}
  .envelope.open .env-letter{transform:translateY(-55%)}
  .tap-hint{margin-top:34px;color:var(--muted);letter-spacing:.2em;text-transform:uppercase;font-size:13px;animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  /* ---------- LATICE ---------- */
  .petal{position:fixed;top:-30px;z-index:90;pointer-events:none;width:14px;height:14px;background:var(--blush);border-radius:14px 0 14px 0;opacity:.85;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot));opacity:.2}}

  /* ---------- SADRŽAJ ---------- */
  section{padding:80px 24px;max-width:720px;margin:0 auto;text-align:center}
  .reveal{opacity:0;transform:translateY(30px);transition:opacity 1s ease, transform 1s ease}
  .reveal.visible{opacity:1;transform:none}
  .divider{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--gold);margin:22px auto}
  .divider::before,.divider::after{content:"";height:1px;width:70px;background:var(--gold-soft)}
  h2{font-family:'Great Vibes',cursive;font-weight:400;font-size:clamp(40px,10vw,56px);color:var(--gold);line-height:1.2;margin-bottom:8px}
  .eyebrow{letter-spacing:.3em;text-transform:uppercase;font-size:13px;color:var(--muted)}

  #hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative}
  #hero .names{font-family:'Great Vibes',cursive;font-size:clamp(56px,16vw,104px);color:var(--ink);line-height:1.1;margin:18px 0}
  #hero .names .amp{color:var(--gold);display:block;font-size:.6em}
  #hero .date{font-size:clamp(20px,5vw,26px);letter-spacing:.25em;text-transform:uppercase}
  #hero .place{color:var(--muted);font-style:italic;margin-top:6px}
  .scroll-cue{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);color:var(--gold);font-size:26px;animation:bob 2s infinite}
  @keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,8px)}}

  .intro-text{font-size:21px;font-style:italic;max-width:520px;margin:0 auto}

  /* odbrojavanje */
  .countdown{display:flex;justify-content:center;gap:clamp(10px,4vw,28px);margin-top:28px}
  .cd-box{background:var(--paper);border:1px solid var(--gold-soft);border-radius:12px;padding:16px 8px;min-width:clamp(66px,18vw,96px);box-shadow:0 6px 20px rgba(120,90,50,.06)}
  .cd-num{font-size:clamp(30px,8vw,44px);font-weight:600;color:var(--gold);line-height:1}
  .cd-label{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-top:6px}

  /* program */
  .timeline{position:relative;margin:36px auto 0;max-width:460px;text-align:left}
  .timeline::before{content:"";position:absolute;left:22px;top:6px;bottom:6px;width:1px;background:var(--gold-soft)}
  .tl-item{position:relative;padding:0 0 30px 64px}
  .tl-dot{position:absolute;left:8px;top:0;width:29px;height:29px;border-radius:50%;background:var(--paper);border:1px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:14px}
  .tl-time{font-weight:600;color:var(--gold);letter-spacing:.1em}
  .tl-title{font-size:22px}
  .tl-desc{color:var(--muted);font-style:italic;font-size:17px}

  /* lokacije */
  .cards{display:grid;gap:20px;margin-top:30px}
  @media(min-width:640px){.cards{grid-template-columns:1fr 1fr}}
  .card{background:var(--paper);border:1px solid var(--gold-soft);border-radius:16px;padding:28px 22px;box-shadow:0 8px 24px rgba(120,90,50,.06)}
  .card .icon{font-size:30px}
  .card h3{font-weight:600;font-size:23px;margin:8px 0 4px}
  .card p{color:var(--muted);font-size:17px}
  .btn{display:inline-block;margin-top:16px;padding:11px 26px;border-radius:40px;border:1px solid var(--gold);color:var(--gold);text-decoration:none;font-family:inherit;font-size:16px;letter-spacing:.1em;text-transform:uppercase;background:transparent;cursor:pointer;transition:all .3s}
  .btn:hover,.btn:focus-visible{background:var(--gold);color:#fff}
  .btn.solid{background:var(--gold);color:#fff}
  .btn.solid:hover{background:#a07d54}

  /* RSVP */
  form{background:var(--paper);border:1px solid var(--gold-soft);border-radius:18px;padding:30px 22px;margin-top:28px;text-align:left;box-shadow:0 8px 24px rgba(120,90,50,.06)}
  label{display:block;font-size:14px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
  label:first-child{margin-top:0}
  input[type=text],input[type=number],textarea,select{width:100%;padding:12px 14px;border:1px solid var(--gold-soft);border-radius:10px;font-family:inherit;font-size:18px;background:#fff;color:var(--ink)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
  .choice{display:flex;gap:10px}
  .choice input{position:absolute;opacity:0}
  .choice label{flex:1;margin:0;text-align:center;padding:12px;border:1px solid var(--gold-soft);border-radius:10px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:18px;color:var(--ink);transition:all .25s}
  .choice input:checked+label{background:var(--gold);color:#fff;border-color:var(--gold)}
  .choice input:focus-visible+label{outline:2px solid var(--gold);outline-offset:2px}
  .if-coming{transition:opacity .4s}
  .if-coming.hidden{display:none}
  .send-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:24px}
  .thanks{display:none;text-align:center;padding:20px 0}
  .thanks.show{display:block;animation:fadeIn .8s}
  @keyframes fadeIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  .deadline{margin-top:10px;color:var(--muted);font-style:italic}

  /* FAQ */
  details{background:var(--paper);border:1px solid var(--gold-soft);border-radius:12px;margin-top:12px;text-align:left;padding:0 20px}
  summary{cursor:pointer;padding:16px 0;font-size:20px;list-style:none;display:flex;justify-content:space-between;align-items:center}
  summary::-webkit-details-marker{display:none}
  summary::after{content:"+";color:var(--gold);font-size:26px;transition:transform .3s}
  details[open] summary::after{transform:rotate(45deg)}
  details p{padding:0 0 16px;color:var(--muted)}

  footer{text-align:center;padding:60px 24px 80px}
  footer .script{font-size:44px;color:var(--gold)}

  /* glazba */
  #music-btn{position:fixed;right:16px;bottom:16px;z-index:50;width:48px;height:48px;border-radius:50%;border:1px solid var(--gold);background:var(--paper);color:var(--gold);font-size:20px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none}
  #music-btn.on{animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="locked">

<!-- ===================== OMOTNICA ===================== -->
<div id="envelope-screen" role="button" tabindex="0" aria-label="Otvori pozivnicu">
  <div class="envelope" id="envelope">
    <div class="env-back"></div>
    <div class="env-letter"><span class="eyebrow">Pozivnica</span><span class="script" data-fill="initials"></span></div>
    <div class="env-front"></div>
    <div class="env-flap"><svg viewBox="0 0 100 62" preserveAspectRatio="none"><polygon points="0,0 100,0 50,62" fill="#dcc7ab"/></svg></div>
    <div class="seal" data-fill="sealInitials"></div>
  </div>
  <p class="tap-hint">Dodirni za otvaranje</p>
</div>

<!-- ===================== NASLOVNA ===================== -->
<section id="hero">
  <p class="eyebrow reveal">Sa zadovoljstvom vas pozivamo na naše vjenčanje</p>
  <h1 class="names reveal"><span data-fill="bride"></span><span class="amp">&amp;</span><span data-fill="groom"></span></h1>
  <p class="date reveal" data-fill="dateText"></p>
  <p class="place reveal" data-fill="city"></p>
  <div class="scroll-cue" aria-hidden="true">⌄</div>
</section>

<section>
  <div class="divider reveal">❦</div>
  <p class="intro-text reveal" data-fill="intro"></p>
  <div class="divider reveal">❦</div>
</section>

<!-- ===================== ODBROJAVANJE ===================== -->
<section id="countdown-section">
  <h2 class="reveal">Još samo</h2>
  <div class="countdown reveal" id="countdown">
    <div class="cd-box"><div class="cd-num" id="cd-d">0</div><div class="cd-label">dana</div></div>
    <div class="cd-box"><div class="cd-num" id="cd-h">0</div><div class="cd-label">sati</div></div>
    <div class="cd-box"><div class="cd-num" id="cd-m">0</div><div class="cd-label">minuta</div></div>
    <div class="cd-box"><div class="cd-num" id="cd-s">0</div><div class="cd-label">sekundi</div></div>
  </div>
  <button class="btn reveal" id="cal-btn" style="margin-top:28px">📅 Dodaj u kalendar</button>
</section>

<!-- ===================== PROGRAM ===================== -->
<section id="program">
  <h2 class="reveal">Program dana</h2>
  <div class="timeline" id="timeline"></div>
</section>

<!-- ===================== LOKACIJE ===================== -->
<section id="lokacije">
  <h2 class="reveal">Lokacije</h2>
  <div class="cards" id="locations"></div>
</section>

<!-- ===================== RSVP ===================== -->
<section id="rsvp">
  <h2 class="reveal">Potvrda dolaska</h2>
  <p class="reveal">Molimo vas da nam javite dolazite li</p>
  <p class="deadline reveal" data-fill="rsvpDeadlineText"></p>

  <form id="rsvp-form" class="reveal" novalidate>
    <label for="f-name">Ime i prezime</label>
    <input type="text" id="f-name" required autocomplete="name" placeholder="npr. Ivana Horvat">

    <label>Dolazite li?</label>
    <div class="choice">
      <input type="radio" name="coming" id="c-yes" value="da" checked><label for="c-yes">Dolazim 🥂</label>
      <input type="radio" name="coming" id="c-no" value="ne"><label for="c-no">Nažalost ne</label>
    </div>

    <div class="if-coming" id="if-coming">
      <label for="f-guests">Broj osoba (uključujući vas)</label>
      <input type="number" id="f-guests" min="1" max="10" value="1">

      <label for="f-menu">Prehrana</label>
      <select id="f-menu">
        <option>Bez posebnih zahtjeva</option>
        <option>Vegetarijanski</option>
        <option>Veganski</option>
        <option>Bez glutena</option>
        <option>Drugo (navedite u poruci)</option>
      </select>
    </div>

    <label for="f-msg">Poruka mladencima (nije obavezno)</label>
    <textarea id="f-msg" rows="3" placeholder="Vaše čestitke, pitanja ili želje za pjesmu..."></textarea>

    <div class="send-row" id="send-row"></div>
    <div class="thanks" id="thanks">
      <div class="script" style="font-size:42px;color:var(--gold)">Hvala!</div>
      <p id="thanks-text"></p>
    </div>
  </form>
</section>

<!-- ===================== FAQ ===================== -->
<section id="info">
  <h2 class="reveal">Korisno je znati</h2>
  <div id="faq" class="reveal"></div>
</section>

<footer>
  <div class="divider">❦</div>
  <p>Veselimo se slavlju s vama!</p>
  <div class="script" data-fill="initials"></div>
</footer>

<button id="music-btn" aria-label="Uključi ili isključi glazbu">♪</button>
<audio id="music" loop preload="none"></audio>

<script>
/* =========================================================
   ✏️  OVDJE UPIŠITE SVOJE PODATKE — sve ostalo se samo složi
   ========================================================= */
const WEDDING = {
  bride: "Dora",
  groom: "Filip",
  // Datum i sat ceremonije (format: GGGG-MM-DDTHH:MM)
  date: "2027-07-17T16:00",
  durationHours: 10,                 // za unos u kalendar
  city: "Zagreb",
  intro: "Uz radost u srcu i ljubav koja nas je spojila, pozivamo vas da s nama podijelite najljepši dan našeg života.",

  program: [
    { time: "15:00", icon: "🥂", title: "Doček gostiju", desc: "Okupljanje ispred crkve" },
    { time: "16:00", icon: "💍", title: "Vjenčanje", desc: "Crkva sv. Marka" },
    { time: "18:00", icon: "📸", title: "Fotografiranje i koktel", desc: "Vrt restorana" },
    { time: "19:30", icon: "🍽️", title: "Svečana večera", desc: "Restoran Vila Rosa" },
    { time: "21:00", icon: "💃", title: "Prvi ples i zabava", desc: "Do kasno u noć!" }
  ],

  locations: [
    { icon: "⛪", title: "Ceremonija", name: "Crkva sv. Marka", address: "Trg sv. Marka 5, Zagreb", time: "16:00",
      maps: "https://maps.google.com/?q=Crkva+sv.+Marka+Zagreb" },
    { icon: "🥂", title: "Proslava", name: "Restoran Vila Rosa", address: "Primjer ulica 1, Zagreb", time: "19:30",
      maps: "https://maps.google.com/?q=Zagreb" }
  ],

  // RSVP — potvrde stižu kao poruka na WhatsApp i/ili e-mail
  rsvpDeadline: "2027-05-15",
  whatsapp: "385917221056",          // broj bez + i razmaka; ostavite "" da sakrijete gumb
  email: "racki.barbara@gmail.com",   // ostavite "" da sakrijete gumb

  faq: [
    { q: "Dress code", a: "Svečano. Dame, preporučujemo udobnu obuću jer je dio slavlja u vrtu." },
    { q: "Mogu li povesti pratnju?", a: "Molimo navedite točan broj osoba u potvrdi dolaska kako bismo sve pripremili." },
    { q: "Parking", a: "Besplatan parking dostupan je kod restorana." },
    { q: "Pokloni", a: "Vaša prisutnost nam je najveći dar. Ako nas ipak želite darovati, kuverta će nam pomoći u novom početku." }
  ],

  // Neobavezno: link na mp3 datoteku (npr. "glazba.mp3" u istom folderu). Ostavite "" za bez glazbe.
  music: ""
};
/* ========================================================= */

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const MONTHS = ["siječnja","veljače","ožujka","travnja","svibnja","lipnja","srpnja","kolovoza","rujna","listopada","studenoga","prosinca"];
const DAYS = ["nedjelja","ponedjeljak","utorak","srijeda","četvrtak","petak","subota"];
const wDate = new Date(WEDDING.date);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* --- popunjavanje teksta --- */
const dl = new Date(WEDDING.rsvpDeadline);
const fills = {
  bride: WEDDING.bride, groom: WEDDING.groom, city: WEDDING.city, intro: WEDDING.intro,
  initials: `${WEDDING.bride} & ${WEDDING.groom}`,
  sealInitials: `${WEDDING.bride[0]}${WEDDING.groom[0]}`,
  dateText: `${DAYS[wDate.getDay()]}, ${wDate.getDate()}. ${MONTHS[wDate.getMonth()]} ${wDate.getFullYear()}.`,
  rsvpDeadlineText: WEDDING.rsvpDeadline ? `do ${dl.getDate()}. ${MONTHS[dl.getMonth()]} ${dl.getFullYear()}.` : ""
};
document.querySelectorAll("[data-fill]").forEach(el => el.textContent = fills[el.dataset.fill] || "");
document.title = `${WEDDING.bride} & ${WEDDING.groom} — Pozivnica`;

$("#timeline").innerHTML = WEDDING.program.map(p => `
  <div class="tl-item reveal">
    <div class="tl-dot">${p.icon}</div>
    <div class="tl-time">${esc(p.time)}</div>
    <div class="tl-title">${esc(p.title)}</div>
    <div class="tl-desc">${esc(p.desc)}</div>
  </div>`).join("");

$("#locations").innerHTML = WEDDING.locations.map(l => `
  <div class="card reveal">
    <div class="icon">${l.icon}</div>
    <div class="eyebrow" style="margin-top:6px">${esc(l.title)} · ${esc(l.time)}</div>
    <h3>${esc(l.name)}</h3>
    <p>${esc(l.address)}</p>
    <a class="btn" href="${esc(l.maps)}" target="_blank" rel="noopener">📍 Upute</a>
  </div>`).join("");

$("#faq").innerHTML = WEDDING.faq.map(f => `<details><summary>${esc(f.q)}</summary><p>${esc(f.a)}</p></details>`).join("");

/* --- omotnica + latice --- */
function openEnvelope(){
  const env = $("#envelope");
  if (env.classList.contains("open")) return;
  env.classList.add("open");
  setTimeout(() => {
    $("#envelope-screen").classList.add("gone");
    document.body.classList.remove("locked");
    petals(40);
    startMusic();
  }, 1700);
}
$("#envelope-screen").addEventListener("click", openEnvelope);
$("#envelope-screen").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openEnvelope(); } });

function petals(n){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for (let i = 0; i < n; i++){
    const p = document.createElement("div");
    p.className = "petal";
    p.style.left = Math.random()*100 + "vw";
    p.style.setProperty("--dx", (Math.random()*200-100) + "px");
    p.style.setProperty("--rot", (Math.random()*720) + "deg");
    p.style.animationDuration = (4 + Math.random()*4) + "s";
    p.style.animationDelay = (Math.random()*2.5) + "s";
    p.style.background = ["#e9cfc6","#f3e1d8","#e8d9c4","#dfe6da"][i%4];
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 11000);
  }
}

/* --- pojavljivanje pri skrolanju --- */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting){ e.target.classList.add("visible"); io.unobserve(e.target);} }), {threshold:.15});
document.querySelectorAll(".reveal").forEach(el => io.observe(el));

/* --- odbrojavanje --- */
function tick(){
  let diff = Math.max(0, wDate - new Date());
  const d = Math.floor(diff/864e5); diff -= d*864e5;
  const h = Math.floor(diff/36e5); diff -= h*36e5;
  const m = Math.floor(diff/6e4); diff -= m*6e4;
  const s = Math.floor(diff/1e3);
  $("#cd-d").textContent = d; $("#cd-h").textContent = pad(h);
  $("#cd-m").textContent = pad(m); $("#cd-s").textContent = pad(s);
  if (wDate - new Date() <= 0){
    $("#countdown-section h2").textContent = "Danas je naš dan!";
  }
}
tick(); setInterval(tick, 1000);

/* --- dodaj u kalendar (.ics) --- */
$("#cal-btn").addEventListener("click", () => {
  const fmt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const end = new Date(wDate.getTime() + WEDDING.durationHours*36e5);
  const loc = WEDDING.locations.map(l => `${l.name}, ${l.address}`).join(" / ");
  const ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Pozivnica//HR","BEGIN:VEVENT",
    `UID:${Date.now()}@pozivnica`,`DTSTAMP:${fmt(new Date())}`,
    `DTSTART:${fmt(wDate)}`,`DTEND:${fmt(end)}`,
    `SUMMARY:Vjenčanje ${WEDDING.bride} & ${WEDDING.groom}`,
    `LOCATION:${loc.replace(/,/g,"\\,")}`,
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Sutra je vjenčanje!","END:VALARM",
    "END:VEVENT","END:VCALENDAR"
  ].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], {type:"text/calendar"}));
  a.download = "vjencanje.ics"; a.click();
});

/* --- RSVP --- */
const sendRow = $("#send-row");
if (WEDDING.whatsapp) sendRow.insertAdjacentHTML("beforeend", `<button type="button" class="btn solid" data-via="wa">Pošalji putem WhatsAppa</button>`);
if (WEDDING.email) sendRow.insertAdjacentHTML("beforeend", `<button type="button" class="btn" data-via="mail">Pošalji e-mailom</button>`);

document.querySelectorAll('input[name="coming"]').forEach(r => r.addEventListener("change", () => {
  $("#if-coming").classList.toggle("hidden", $("#c-no").checked);
}));

sendRow.addEventListener("click", e => {
  const btn = e.target.closest("[data-via]"); if (!btn) return;
  const name = $("#f-name").value.trim();
  if (!name){ $("#f-name").focus(); $("#f-name").style.borderColor = "#c0766a"; return; }
  const coming = $("#c-yes").checked;
  const lines = [
    `Potvrda dolaska — vjenčanje ${WEDDING.bride} & ${WEDDING.groom}`,
    ``,
    `Ime: ${name}`,
    `Dolazak: ${coming ? "DA 🥂" : "NE"}`,
    ...(coming ? [`Broj osoba: ${$("#f-guests").value}`, `Prehrana: ${$("#f-menu").value}`] : []),
    ...($("#f-msg").value.trim() ? [``, `Poruka: ${$("#f-msg").value.trim()}`] : [])
  ];
  const text = lines.join("\n");
  const url = btn.dataset.via === "wa"
    ? `https://wa.me/${WEDDING.whatsapp}?text=${encodeURIComponent(text)}`
    : `mailto:${WEDDING.email}?subject=${encodeURIComponent("Potvrda dolaska — " + name)}&body=${encodeURIComponent(text)}`;
  window.open(url, "_blank");
  $("#thanks-text").textContent = coming ? "Veselimo se što ćete biti s nama!" : "Žao nam je što nećete moći doći, mislit ćemo na vas.";
  $("#thanks").classList.add("show");
  if (coming) petals(25);
});

/* --- glazba (neobavezno) --- */
const music = $("#music"), mBtn = $("#music-btn");
function startMusic(){
  if (!WEDDING.music) return;
  music.src = WEDDING.music; mBtn.style.display = "block";
  music.play().then(() => mBtn.classList.add("on")).catch(() => {});
}
mBtn.addEventListener("click", () => {
  if (music.paused){ music.play(); mBtn.classList.add("on"); }
  else { music.pause(); mBtn.classList.remove("on"); }
});
</script>
</body>
